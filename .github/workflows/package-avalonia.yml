name: Package Avalonia

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  # CI 测试产生的临时实例不应计入真实用户统计。
  SVL_DISABLE_ANON_TELEMETRY: '1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore tests
        run: dotnet restore SVL.Migration.Tests/SVL.Migration.Tests.csproj

      - name: Run tests
        run: dotnet test SVL.Migration.Tests/SVL.Migration.Tests.csproj --configuration Debug --no-restore

      - name: Verify Release diagnostics and update selection
        run: dotnet test SVL.Migration.Tests/SVL.Migration.Tests.csproj --configuration Release --no-restore --filter "FullyQualifiedName~RuntimeDebugLogTests|FullyQualifiedName~LauncherUpdateReleaseTests|FullyQualifiedName~LauncherUpdateSafetyTests|FullyQualifiedName~SettingsPersistenceTests"

  package:
    name: Package Windows x64
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build bundled and framework-dependent Windows archives
        shell: pwsh
        run: |
          ./build.ps1 -Config Release -Targets windows -OutputDirectory artifacts/bundled
          if ($LASTEXITCODE -ne 0) { throw 'Bundled build failed.' }
          ./build.ps1 -Config Release -Targets windows -OutputDirectory artifacts/lightweight -FrameworkDependent
          if ($LASTEXITCODE -ne 0) { throw 'Framework-dependent build failed.' }
          $legacy = @(Get-ChildItem artifacts/bundled -Filter 'SVL.Desktop_v*_Release.exe')
          $lightLegacy = @(Get-ChildItem artifacts/lightweight -Filter 'SVL.Desktop_v*_Release.exe')
          if ($legacy.Count -ne 1 -or $lightLegacy.Count -ne 0) { throw 'Unsafe WPF upgrade asset configuration.' }
          $lite = @(Get-ChildItem artifacts/lightweight -Filter '*_requires_dotnet10.zip')
          if ($lite.Count -ne 1) { throw 'Framework-dependent Windows ZIP is missing.' }

      - name: Verify Windows executable runtime modes
        shell: pwsh
        run: |
          $probeDir = Join-Path $env:RUNNER_TEMP 'svl-runtime-probe'
          dotnet build scripts/RuntimeModeProbe/RuntimeModeProbe.csproj -c Release -o $probeDir
          if ($LASTEXITCODE -ne 0) { throw 'Could not build runtime-mode probe.' }
          $env:DOTNET_STARTUP_HOOKS = Join-Path $probeDir 'SVL.RuntimeModeProbe.dll'
          $env:DOTNET_BUNDLE_EXTRACT_BASE_DIR = Join-Path $env:RUNNER_TEMP 'svl-bundle-extract'
          $cases = @(
            @{ Archive = (Get-ChildItem artifacts/bundled -File -Filter 'SVL_v*_release_Windows_x64.zip' | Select-Object -First 1); Expected = 41; Directory = 'svl-win-bundled' },
            @{ Archive = (Get-ChildItem artifacts/lightweight -File -Filter '*_requires_dotnet10.zip' | Select-Object -First 1); Expected = 42; Directory = 'svl-win-lite' }
          )
          foreach ($case in $cases) {
            $extracted = Join-Path $env:RUNNER_TEMP $case.Directory
            Expand-Archive -LiteralPath $case.Archive.FullName -DestinationPath $extracted
            $exe = Join-Path $extracted 'SVL.Avalonia.exe'
            $process = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden
            if (-not $process.WaitForExit(30000)) { $process.Kill(); throw "Runtime-mode probe timed out: $exe" }
            if ($process.ExitCode -ne $case.Expected) { throw "Incorrect runtime mode in $exe (exit $($process.ExitCode))." }
          }
          $legacy = (Get-ChildItem artifacts/bundled -File -Filter 'SVL.Desktop_v*_Release.exe' | Select-Object -First 1).FullName
          $process = Start-Process -FilePath $legacy -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(30000)) { $process.Kill(); throw 'WPF upgrade probe timed out.' }
          if ($process.ExitCode -ne 41) { throw 'WPF upgrade executable must be self-contained.' }

      - name: Verify Linux ZIP generated on Windows
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'svl-linux-cross'
          ./build.ps1 -Config Release -Targets linux -OutputDirectory $output
          if ($LASTEXITCODE -ne 0) { throw 'Linux cross-build failed.' }
          $archive = Get-ChildItem $output -Filter 'SVL_v*_release_Linux_x64.zip' | Select-Object -First 1
          if ($null -eq $archive) { throw 'Linux archive was not generated.' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archive.FullName)
          try {
            $entry = $zip.GetEntry('run-svl.sh')
            if ($null -eq $entry) { throw 'Linux launcher script is missing.' }
            $stream = $entry.Open()
            $memory = [System.IO.MemoryStream]::new()
            try {
              $stream.CopyTo($memory)
              if ([Array]::IndexOf($memory.ToArray(), [byte]13) -ge 0) {
                throw 'Linux launcher script must not contain CR characters.'
              }
            } finally {
              $memory.Dispose()
              $stream.Dispose()
            }
          } finally {
            $zip.Dispose()
          }

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: SVL-Avalonia-win-x64
          path: artifacts/bundled/SVL_v*_release_Windows_x64.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload WPF upgrade executable
        uses: actions/upload-artifact@v7
        with:
          name: SVL-Avalonia-WPF-upgrade-win-x64
          path: artifacts/bundled/SVL.Desktop_v*_Release.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload framework-dependent package
        uses: actions/upload-artifact@v7
        with:
          name: SVL-Avalonia-win-x64-requires-dotnet10
          path: |
            artifacts/lightweight/*_requires_dotnet10.zip
            artifacts/lightweight/standalone/*_requires_dotnet10.exe
          if-no-files-found: error
          retention-days: 14

  package-linux:
    name: Package Linux x64
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build Linux archive with launcher
        shell: pwsh
        run: |
          ./build.ps1 -Config Release -Targets linux -OutputDirectory artifacts
          if ($LASTEXITCODE -ne 0) { throw 'Bundled build failed.' }
          ./build.ps1 -Config Release -Targets linux -OutputDirectory artifacts/lightweight -FrameworkDependent
          if ($LASTEXITCODE -ne 0) { throw 'Framework-dependent build failed.' }

      - name: Verify and smoke-test framework-dependent Linux packages
        shell: bash
        run: |
          set -euo pipefail
          dotnet build scripts/RuntimeModeProbe/RuntimeModeProbe.csproj -c Release -o "$RUNNER_TEMP/svl-runtime-probe"
          zip=$(find artifacts/lightweight -maxdepth 1 -name '*_requires_dotnet10.zip' -print -quit)
          deb=$(find artifacts/lightweight -maxdepth 1 -name '*_requires_dotnet10.deb' -print -quit)
          test -n "$zip" && test -n "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = 'svl-launcher'
          dpkg-deb -f "$deb" Depends | grep -qF 'dotnet-runtime-10.0'
          mkdir -p "$RUNNER_TEMP/svl-lite" "$RUNNER_TEMP/svl-lite-deb"
          unzip -q "$zip" -d "$RUNNER_TEMP/svl-lite"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/svl-lite-deb"
          cmp "$RUNNER_TEMP/svl-lite/SVL.Avalonia" "$RUNNER_TEMP/svl-lite-deb/usr/lib/svl/SVL.Avalonia"
          export DOTNET_STARTUP_HOOKS="$RUNNER_TEMP/svl-runtime-probe/SVL.RuntimeModeProbe.dll"
          export DOTNET_BUNDLE_EXTRACT_BASE_DIR="$RUNNER_TEMP/svl-bundle-extract"
          set +e
          timeout 30s sh "$RUNNER_TEMP/svl-lite/run-svl.sh"
          code=$?
          set -e
          test "$code" -eq 42
          bundled=$(find artifacts -maxdepth 1 -name 'SVL_v*_release_Linux_x64.zip' -print -quit)
          mkdir -p "$RUNNER_TEMP/svl-bundled"
          unzip -q "$bundled" -d "$RUNNER_TEMP/svl-bundled"
          set +e
          timeout 30s sh "$RUNNER_TEMP/svl-bundled/run-svl.sh"
          code=$?
          set -e
          test "$code" -eq 41

      - name: Verify Linux archive entry points
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = Get-ChildItem artifacts -Filter 'SVL_v*_release_Linux_x64.zip' | Select-Object -First 1
          if ($null -eq $archive) { throw 'Linux archive was not generated.' }
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archive.FullName)
          try {
            $entries = @($zip.Entries | ForEach-Object FullName)
            if ($entries -notcontains 'SVL.Avalonia') { throw 'Linux apphost is missing from the archive.' }
            if ($entries -notcontains 'run-svl.sh') { throw 'Linux launcher script is missing from the archive.' }
            $launcherEntry = $zip.GetEntry('run-svl.sh')
            $reader = [System.IO.StreamReader]::new($launcherEntry.Open())
            try {
              $launcherContent = $reader.ReadToEnd()
            } finally {
              $reader.Dispose()
            }
            & bash -n -c $launcherContent
            if ($LASTEXITCODE -ne 0) { throw 'Linux launcher script failed Bash syntax validation.' }
          } finally {
            $zip.Dispose()
          }

      - name: Verify Ubuntu/Debian installer
        shell: bash
        run: |
          set -euo pipefail
          deb=$(find artifacts -maxdepth 1 -name 'svl-launcher_*_amd64.deb' -print -quit)
          test -n "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = 'svl-launcher'
          test "$(dpkg-deb -f "$deb" Architecture)" = 'amd64'
          dpkg-deb -x "$deb" "$RUNNER_TEMP/svl-deb-validation"
          test -x "$RUNNER_TEMP/svl-deb-validation/usr/bin/svl"
          test -L "$RUNNER_TEMP/svl-deb-validation/usr/bin/svl"
          cmp "$RUNNER_TEMP/svl-deb-validation/usr/lib/svl/SVL.Avalonia" artifacts/SVL_v*_release_Linux_x64_publish/SVL.Avalonia
          test -f "$RUNNER_TEMP/svl-deb-validation/usr/share/applications/svl.desktop"
          test -f "$RUNNER_TEMP/svl-deb-validation/usr/share/icons/hicolor/256x256/apps/svl.png"
          grep -Fx 'Name=Stardew Valley Launcher' "$RUNNER_TEMP/svl-deb-validation/usr/share/applications/svl.desktop"
          grep -Fx 'Name[zh_CN]=Stardew Valley Launcher' "$RUNNER_TEMP/svl-deb-validation/usr/share/applications/svl.desktop"
          if command -v desktop-file-validate >/dev/null; then
            desktop-file-validate "$RUNNER_TEMP/svl-deb-validation/usr/share/applications/svl.desktop"
          fi

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: SVL-Avalonia-linux-x64
          path: |
            artifacts/SVL_v*_release_Linux_x64.zip
            artifacts/svl-launcher_*_amd64.deb
            artifacts/standalone/SVL_v*_release_Linux_x64
          if-no-files-found: error
          retention-days: 14

      - name: Upload framework-dependent packages
        uses: actions/upload-artifact@v7
        with:
          name: SVL-Avalonia-linux-x64-requires-dotnet10
          path: |
            artifacts/lightweight/*_requires_dotnet10.zip
            artifacts/lightweight/*_requires_dotnet10.deb
            artifacts/lightweight/standalone/*_requires_dotnet10
          if-no-files-found: error
          retention-days: 14

  package-macos:
    name: Package macOS app bundles
    needs: test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build app bundles with NXM scheme and disk images
        shell: pwsh
        run: |
          ./build.ps1 -Config Release -Targets macos -OutputDirectory artifacts/bundled
          if ($LASTEXITCODE -ne 0) { throw 'Bundled build failed.' }
          ./build.ps1 -Config Release -Targets macos -OutputDirectory artifacts/lightweight -FrameworkDependent
          if ($LASTEXITCODE -ne 0) { throw 'Framework-dependent build failed.' }

      - name: Verify both app bundles declare the NXM scheme
        shell: pwsh
        run: |
          $bundles = @(Get-ChildItem artifacts/bundled,artifacts/lightweight -Directory -Filter '*.app')
          if ($bundles.Count -ne 4) { throw "Expected 4 macOS app bundles; found $($bundles.Count)." }
          foreach ($bundle in $bundles) {
            $plist = Join-Path $bundle.FullName 'Contents/Info.plist'
            $apphost = Join-Path $bundle.FullName 'Contents/MacOS/SVL.Avalonia'
            $coreclr = Join-Path $bundle.FullName 'Contents/MacOS/libcoreclr.dylib'
            if (-not (Test-Path -LiteralPath $plist -PathType Leaf)) { throw "Missing Info.plist: $plist" }
            if (-not (Test-Path -LiteralPath $apphost -PathType Leaf)) { throw "Missing macOS apphost: $apphost" }
            if ($bundle.Name -like '*_requires_dotnet10.app') {
              if (Test-Path -LiteralPath $coreclr) { throw "Framework-dependent app includes a runtime: $bundle" }
              $runtimeconfig = Join-Path $bundle.FullName 'Contents/MacOS/SVL.Avalonia.runtimeconfig.json'
              $framework = (Get-Content -Raw $runtimeconfig | ConvertFrom-Json).runtimeOptions.framework.name
              if ($framework -ne 'Microsoft.NETCore.App') { throw "Incorrect runtime requirement in $bundle" }
            } elseif (-not (Test-Path -LiteralPath $coreclr)) { throw "Bundled app is missing its runtime: $bundle" }
            & codesign --verify --deep --strict $bundle.FullName
            if ($LASTEXITCODE -ne 0) { throw "Invalid macOS app signature: $bundle" }
            & plutil -lint $plist
            if ($LASTEXITCODE -ne 0) { throw "Invalid Info.plist: $plist" }
            $scheme = & /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' $plist
            if ($LASTEXITCODE -ne 0 -or $scheme.Trim() -ne 'nxm') { throw "NXM URL scheme is missing: $plist" }
            $name = & /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' $plist
            if ($LASTEXITCODE -ne 0 -or $name.Trim() -ne 'Stardew Valley Launcher') { throw "Unexpected CFBundleDisplayName in ${plist}: $name" }
            $minimumSystemVersion = & /usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' $plist
            if ($LASTEXITCODE -ne 0 -or $minimumSystemVersion.Trim() -ne '14.0') {
              throw "Unexpected macOS minimum system version in ${plist}: $minimumSystemVersion"
            }
          }
          $images = @(Get-ChildItem artifacts/bundled,artifacts/lightweight -File -Filter '*.dmg')
          if ($images.Count -ne 4) { throw "Expected 4 macOS disk images; found $($images.Count)." }
          $expectedLayout = (Get-FileHash packaging/macos/installer-layout.dsstore -Algorithm SHA256).Hash
          foreach ($image in $images) {
            $mount = Join-Path ([IO.Path]::GetTempPath()) ("svl-dmg-test-" + [guid]::NewGuid().ToString('N'))
            New-Item -ItemType Directory -Path $mount | Out-Null
            $mounted = $false
            try {
              & hdiutil attach -quiet -readonly -nobrowse -mountpoint $mount $image.FullName
              if ($LASTEXITCODE -ne 0) { throw "Failed to mount $image" }
              $mounted = $true
              $layout = Join-Path $mount '.DS_Store'
              $background = Join-Path $mount '.background/installer.png'
              $app = Join-Path $mount 'Stardew Valley Launcher.app'
              $applications = Join-Path $mount 'Applications'
              if (-not (Test-Path -LiteralPath $layout -PathType Leaf) -or
                  -not (Test-Path -LiteralPath $background -PathType Leaf) -or
                  -not (Test-Path -LiteralPath $app -PathType Container) -or
                  -not (Test-Path -LiteralPath $applications)) { throw "Incomplete installer layout: $image" }
              if ((Get-FileHash -LiteralPath $layout -Algorithm SHA256).Hash -ne $expectedLayout) {
                throw "Unexpected Finder layout: $image"
              }
              & codesign --verify --deep --strict $app
              if ($LASTEXITCODE -ne 0) { throw "Invalid app inside $image" }
            } finally {
              if ($mounted) { & hdiutil detach -quiet $mount }
              if (-not $mounted -or $LASTEXITCODE -eq 0) { Remove-Item -LiteralPath $mount -Force }
            }
          }

      - name: Verify native macOS app runtime modes
        shell: bash
        run: |
          set -euo pipefail
          dotnet build scripts/RuntimeModeProbe/RuntimeModeProbe.csproj -c Release -o "$RUNNER_TEMP/svl-runtime-probe"
          case "$(uname -m)" in
            arm64) arch=arm64 ;;
            x86_64) arch=x64 ;;
            *) echo 'Unsupported runner architecture' >&2; exit 1 ;;
          esac
          lite=$(find artifacts/lightweight -maxdepth 1 -type d -name "*_${arch}_requires_dotnet10.app" -print -quit)
          bundled=$(find artifacts/bundled -maxdepth 1 -type d -name "*_${arch}.app" -print -quit)
          test -n "$lite" && test -n "$bundled"
          export DOTNET_STARTUP_HOOKS="$RUNNER_TEMP/svl-runtime-probe/SVL.RuntimeModeProbe.dll"
          export DOTNET_BUNDLE_EXTRACT_BASE_DIR="$RUNNER_TEMP/svl-bundle-extract"
          python3 - "$lite/Contents/MacOS/SVL.Avalonia" "$bundled/Contents/MacOS/SVL.Avalonia" <<'PY'
          import subprocess
          import sys
          for executable, expected in zip(sys.argv[1:], (42, 41)):
              result = subprocess.run([executable], timeout=30, check=False)
              if result.returncode != expected:
                  raise SystemExit(f"Incorrect runtime mode in {executable}: {result.returncode}")
          PY

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: SVL-Avalonia-macos-apps
          path: |
            artifacts/bundled/*.dmg
            artifacts/lightweight/*.dmg
          if-no-files-found: error
          retention-days: 14
